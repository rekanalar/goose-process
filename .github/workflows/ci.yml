name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tag: [v2026.3, v2026.4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install the Goose release
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/goose"
          mkdir -p "$dest"
          tag="${{ matrix.tag }}"
          case "$RUNNER_OS" in
            Linux) asset="linux-x64.tar.gz" ;;
            macOS) asset="macos-arm64.tar.gz" ;;
            Windows) asset="windows-x64.zip" ;;
          esac
          url="https://github.com/aardappel/goose/releases/download/${tag}/goose-${tag}-${asset}"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL "$url" -o "$dest/goose.zip"
            7z x -y -o"$dest" "$dest/goose.zip" > /dev/null
            exe=$(find "$dest" -type f -name goose.exe | head -1)
          else
            curl -fsSL "$url" -o "$dest/goose.tar.gz"
            tar -xzf "$dest/goose.tar.gz" -C "$dest"
            exe=$(find "$dest" -type f -name goose | head -1)
          fi
          chmod +x "$exe"
          echo "$(dirname "$exe")" > "$RUNNER_TEMP/goose-dir"
          "$exe" --help | head -3

      - name: Run the gate
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scratch"
          TMPDIR="$RUNNER_TEMP/scratch" GOOSE_HOME="$RUNNER_TEMP/goose-home" \
            bash run-gate.sh "$(cat "$RUNNER_TEMP/goose-dir")"
